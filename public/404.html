<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <!--
      GitHub Pages SPA fallback: unknown paths serve this file. We must redirect
      to an absolute app entry (from Vite base), not ./index.html — relative URLs
      break deep links (e.g. /routes/foo → /routes/index.html).

      __VITE_SPA_INDEX__ is replaced at build time (see vite.config.ts).
      Cloudflare Pages uses public/_redirects instead and normally never hits this.
    -->
    <script>
      sessionStorage.setItem('ghp_redirect', location.href)
      location.replace('__VITE_SPA_INDEX__')
    </script>
  </head>
  <body>
    <p><a href="__VITE_SPA_INDEX__">Continue to site</a></p>
  </body>
</html>
