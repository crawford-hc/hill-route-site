<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f2" />
    <title>Hill routes</title>
    <script>
      ;(function () {
        var r = sessionStorage.getItem('ghp_redirect')
        if (r) {
          sessionStorage.removeItem('ghp_redirect')
          if (r !== location.href) history.replaceState(null, '', r)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
